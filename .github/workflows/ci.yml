name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies (site)
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Install dependencies (package)
        working-directory: packages/markaui
        run: bun install --frozen-lockfile

      - name: Build npm package (sync + tsup)
        working-directory: packages/markaui
        run: bun run build

      - name: Smoke test package exports
        working-directory: packages/markaui
        run: node -e "const m=require('./dist/index.cjs'); const n=Object.keys(m).length; if(n<400){process.exit(1)}; console.log('exports:',n)"
